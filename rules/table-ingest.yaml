# 表格摄取 · 规则库
#
# 本包是**结构转换工具**，不是规则检查器：它把 docx / xlsx / csv 转成表格 JSON，
# 供下游规则包消费。因此这里没有可执行的规则。
#
# 保留这个文件（而不是删掉）的原因：
#   - 本族的包结构约定每个包都有 rules/<pack>.yaml，工装脚本按它定位；
#   - 下游把本包的输出喂给真正的规则包时，规则与数据仍然分离。
#
# 若将来需要在本包内加"材料结构自检"类规则（例如"这张表必须有表头"），
# 直接在此追加即可，格式与其它规则包一致。

plugin: dsh-table-ingest
version: "2026.1"

rules: []
